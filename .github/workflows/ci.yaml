name: CI

# Type-check, lint, test, and build on every push to any branch, including
# `main`. It deliberately does not use the `pull_request` trigger: the
# version PR is opened by github-actions[bot], and GitHub starts a
# `pull_request` run for it that dies with "workflow file issue" and no jobs,
# a permanent red X. Bot pushes with GITHUB_TOKEN never trigger `push`
# workflows, so the version branch is ignored explicitly and gets no run.
# `release.yaml` already runs the same checks before opening that PR and again
# before publishing. Pull requests from forks do not run this workflow.

on:
  push:
    branches-ignore:
      - "changeset-release/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type
      - run: npm run lint
      - run: npm test
      - run: npm run build
