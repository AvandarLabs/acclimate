name: Release

# Publishes @avandar/acclimate to npm and creates a GitHub release.
#
# Flow:
#   1. Work lands on `main`, with no release bookkeeping.
#   2. This workflow writes changesets for everything merged since the last
#      release (bump from commit types and branch prefixes, note text from an
#      Anthropic model), then opens or updates a "Release: @avandar/acclimate"
#      PR that bumps the version and writes CHANGELOG.md.
#   3. Merging that PR runs this workflow again. The current version is not on
#      npm yet, so no changesets are generated and the Changesets action
#      publishes to npm. A final step then tags `v<version>` and creates the
#      GitHub release, with the changelog section as its notes.
#
# Nothing publishes without a human merging the version PR.
#
# There is no npm token. Publishing authenticates over OIDC ("trusted
# publishing"): npm exchanges this run's GitHub identity for a short-lived
# token. The package's trusted publisher on npmjs.com names this repo and this
# filename, so renaming this file breaks publishing until npm is updated.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # version PR branch, tags, GitHub releases
      pull-requests: write # open the version PR
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Gate: never publish something that does not type-check, lint, test,
      # and build.
      - run: npm run type
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Writes `.changeset/auto-*.md` for commits merged since the last
      # release. The files stay uncommitted and are rebuilt every run. Skips
      # when a hand-written changeset exists or the current version is not
      # published yet (the version PR just merged). If the key is missing or
      # the model call fails, notes fall back to commit subjects.
      - name: Generate changesets from merged commits
        run: npm run release:changesets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run release
          title: "Release: @avandar/acclimate"
          commit: "Release: @avandar/acclimate"
          # The action only creates releases when it sees `New tag:` lines in
          # the publish output, which changesets CLI 3 no longer prints. The
          # "Tag and create GitHub release" step below does it instead.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Idempotent: does nothing unless the current version is on npm and has
      # no GitHub release yet. Creates the `v<version>` tag at the commit that
      # set the version, with the changelog section as the release notes.
      - name: Tag and create GitHub release
        run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
